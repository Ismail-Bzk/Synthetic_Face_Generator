name: Blender CI

on:
  push:
  pull_request:

jobs:
  blender-ci:
    runs-on: ubuntu-latest

    env:
      KEENTOOLS_ZIP_URL: ${{ secrets.KEENTOOLS_ZIP_URL || 'https://downloads.keentools.io/keentools-nightly-for-blender' }}

      # Offline core path (dans le workspace)
      KEENTOOLS_CORE_PATH: ${{ github.workspace }}/keentools-core-2025.3.0-linux.zip
      KEENTOOLS_ALLOW_ONLINE: "0"
      KEENTOOLS_PRODUCT: "0"

      # Sandbox Blender user dirs (Blender 3.5.x -> pas de --user-data-dir)
      BLENDER_HOME: ${{ github.workspace }}/.blender_home
      HOME: ${{ github.workspace }}/.blender_home
      XDG_CONFIG_HOME: ${{ github.workspace }}/.blender_home/.config
      XDG_DATA_HOME: ${{ github.workspace }}/.blender_home/.local/share
      XDG_CACHE_HOME: ${{ github.workspace }}/.blender_home/.cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: |
            blender-3.3.21-linux-x64
            blender-3.3.21-linux-x64.tar.xz
          key: blender-3.3.21-linux-x64

      - name: Download Blender 3.3.21
        run: |
          set -e
          if [ ! -d blender-3.3.21-linux-x64 ]; then
            curl -fL -o blender-3.3.21-linux-x64.tar.xz \
              https://download.blender.org/release/Blender3.3/blender-3.3.21-linux-x64.tar.xz
            tar -xf blender-3.3.21-linux-x64.tar.xz
          fi
          ./blender-3.3.21-linux-x64/blender --version


      - name: Prepare dirs
        run: |
          set -e
          mkdir -p ci_output
          mkdir -p "${BLENDER_HOME}" "${XDG_CONFIG_HOME}" "${XDG_DATA_HOME}" "${XDG_CACHE_HOME}"

      - name: Cache Blender home (prefs + KeenTools core)
        uses: actions/cache@v4
        with:
          path: .blender_home
          key: blenderhome-3.5.1-keentools-2025.3.0
          restore-keys: |
            blenderhome-3.5.1-

      - name: Download KeenTools addon
        run: |
          set -e
          echo "KeenTools addon URL: ${KEENTOOLS_ZIP_URL}"
          curl -fL --retry 3 --retry-delay 2 -o keentools.zip "${KEENTOOLS_ZIP_URL}"
          ls -lah keentools.zip

      - name: Download KeenTools core (.pkt)
        run: |
          set -e
          echo "KeenTools core URL: https://downloads.keentools.io/keentools-core-2025_3_0-linux"
          curl -fL --retry 3 --retry-delay 2 \
            -o keentools-core-2025.3.0-linux.zip \
            https://downloads.keentools.io/keentools-core-2025_3_0-linux
          ls -lah keentools-core-2025.3.0-linux.zip

      - name: Install and enable KeenTools addon
        run: |
          set -e
          ./blender-3.3.21-linux-x64/blender --background --factory-startup \
            --python-expr "import bpy, os, addon_utils; p=os.path.abspath('keentools.zip'); print('KeenTools zip:', p); bpy.ops.preferences.addon_install(filepath=p); mods=[m.__name__ for m in addon_utils.modules(refresh=True) if 'keentools' in m.__name__]; print('KeenTools modules:', mods); (lambda ms: (_ for _ in ()).throw(SystemExit('KeenTools addon not found')) if not ms else None)(mods); [bpy.ops.preferences.addon_enable(module=m) for m in mods]; bpy.ops.wm.save_userpref(); print('KeenTools enabled ...'); print('keentools_core: ',os.path.abspath('keentools-core-2025.3.0-linux.zip'));# bpy.ops.keentools_preferences.install_pkt_from_file(filepath=os.path.abspath('keentools-core-2025.3.0-linux.zip'), license_accepted=True);print('Face Builder add ...');bpy.ops.keentools_fb.add_head();print('creation ....');print([i for i in bpy.data.objects]);" \
            2>&1 | tee ci_output/keentools_install.log

      - name: Install KeenTools core and license (2-pass)
        run: |
          set -e

          rc=0
          ./blender-3.3.21-linux-x64/blender --background \
            --python ci_keentools_setup.py 2>&1 | tee ci_output/keentools_setup.log || true
          rc=${PIPESTATUS[0]}

          if [ "$rc" -eq 77 ]; then
            echo "Restart required after KeenTools core install. Restarting Blender..."

            ./blender-3.3.21-linux-x64/blender --background \
              --python ci_keentools_setup.py 2>&1 | tee -a ci_output/keentools_setup.log
          elif [ "$rc" -ne 0 ]; then
            echo "KeenTools setup failed with exit code $rc"
            exit "$rc"
          fi

      - name: Run Blender dataset generation
        run: |
          set -e
          ./blender-3.3.21-linux-x64/blender model_v1/Model_Normal.blend --background \
            --python Launch.py -- HeadModel/Head1.jpeg Pillar ismail 20 -10,10 -10,10 3 True random empty empty random 1 \
            2>&1 | tee ci_output/blender.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-ci-output
          path: |
            ci_output
            ismail
